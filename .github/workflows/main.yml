name: Windows

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Initialize system
        shell: powershell
        run: |
          Write-Host "===== SYSTEM ====="
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host "===== CURRENT USER ====="
          whoami

      - name: Create local account
        shell: powershell
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString `
            $env:ACCESS_PASSWORD `
            -AsPlainText `
            -Force

          if (-not (Get-LocalUser -Name "operator" -ErrorAction SilentlyContinue) ) {
              New-LocalUser `
                -Name "operator" `
                -Password $password `
                -PasswordNeverExpires `
                -UserMayNotChangePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "operator" `
            -ErrorAction SilentlyContinue

          Write-Host "===== ACCOUNT ====="
          Get-LocalUser -Name "operator"

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "Remote Desktop enabled."

      - name: Install Tailscale
        shell: powershell
        run: |
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /qn /norestart" `
            -Wait

      - name: Start Tailscale
        shell: powershell
        run: |
          Start-Service Tailscale `
            -ErrorAction SilentlyContinue

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale version

      - name: Login to Tailscale
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "========================================="
          Write-Host " TAILSCALE LOGIN"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "A login URL will appear below."
          Write-Host "Open that URL in your browser."
          Write-Host ""
          Write-Host "========================================="

          & $tailscale up

      - name: Connection information
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "========================================="
          Write-Host " TAILSCALE CONNECTED"
          Write-Host "========================================="

          & $tailscale status

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          & $tailscale ip -4

          Write-Host ""
          Write-Host "RDP:"
          Write-Host "Username: operator"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " SERVER IS RUNNING"
          Write-Host "========================================="

      - name: Keep alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Server is still running..."
              Start-Sleep -Seconds 300
          }
